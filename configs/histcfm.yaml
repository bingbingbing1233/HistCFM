# HistCFM training configuration template for user-provided datasets.
# Fill all required input paths and provide the exact ordered genes and
# cell types before training.

data:
  histology_path: null                 # Required H x W x 3 aligned histology image.
  nucleus_mask_path: null              # Required H x W integer nucleus-ID mask.
  matched_nuclei_path: null            # Required matched-nuclei CSV.
  expression_path: null                # Required cell-by-gene count CSV.
  cell_type_path: null                 # Required while model.use_cell_types is true.
  average_expression_path: null        # Optional legacy-compatible input; inactive by default.
  genes: []                            # Required exact expression-column order.
  cell_types: []                       # Required exact class order when cell types are enabled.
  validation_split: [0.0, 0.2]
  patch_height: 256
  patch_width: 256
  overlap: 30
  max_cells_per_patch: 200
  min_nucleus_area: 10
  expression_scale: 5.0
  normalization_path: null             # Training creates artifacts/histology_normalization.npy.
  stain_augmentation: false

model:
  embedding_dim: 256
  use_cell_types: true
  use_neighborhood: true
  average_expression_compatibility: false

flow:
  hidden_dim: 512
  num_layers: 8
  k_neighbors: 16
  inference_steps: 5
  prior: gaussian
  train_noise_std: 0.02
  inference_noise_std: 0.05
  target_noise_std: 0.001
  warmup_epochs: 0

uni:
  enabled: true
  mode: precomputed
  index_path: null                     # Required author-provided uni_index.json.
  features_path: null                  # Required author-provided uni_features.npy.
  feature_dim: 1024
  fusion_method: film
  fusion_hidden_dim: 256
  fusion_dropout: 0.0

sonrm:
  enabled: true
  neighbors: 16
  hops: 3
  margin_12: 0.1
  margin_23: 0.1

loss:
  segmentation: 1.0
  histology_cell_type: 1.0
  expression_cell_type: 1.0
  endpoint_expression: 10.0
  neighborhood_expression_immune: 10.0
  neighborhood_expression_invasive: 10.0
  expression_embedding: 100.0
  expression_logits: 1.0
  estimated_composition: 1.0
  histology_composition: 1.0
  uni_hint: 0.1
  sonrm: 0.05

training:
  epochs: 150
  batch_size: 8
  workers: 1
  shuffle: true
  drop_last: true
  optimizer: adamw
  learning_rate: 0.001
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0001
  epsilon: 1.0e-8
  learning_rate_schedule: linear
  initial_learning_rate: 0.001
  final_learning_rate: 1.0e-5
  minimum_learning_rate: 1.0e-5
  switch_ratio: 0.5
  gradient_clip: 0.5
  checkpoint_frequency: 1
  save_optimizer: true
  seed: 42

runtime:
  device: auto
  gpu_index: 0
  deterministic: true
  overwrite_output: false
