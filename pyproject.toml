[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "HistCFM"
dynamic = ["version"]
description = "Cell-level histology-to-expression modeling with conditional flow matching"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "imageio",
  "natsort",
  "numpy",
  "pandas",
  "PyYAML",
  "scikit-learn",
  "tifffile",
  "torch",
  "torchvision",
  "tqdm",
]

[project.optional-dependencies]
stain = ["stainlib"]
test = ["pytest"]

[project.scripts]
histcfm = "histcfm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "histcfm._version.__version__" }
